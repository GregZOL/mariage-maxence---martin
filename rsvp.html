<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Réponse — Mariage Maxence et Martin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="tw.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen font-sans antialiased text-brown-main [background:radial-gradient(circle_at_top_left,#fef7ee_0,#f7efe9_40%,#f2e5db_100%)]">

  <div data-site-header data-header-active="rsvp" data-header-solid="true"></div>
  <div class="max-w-[1120px] mx-auto mb-12 px-4">

    <main class="mt-[18px] px-[26px] pt-7 pb-[30px] rounded-[24px] bg-white/90 border border-white/90 shadow-soft backdrop-blur-[18px]">

      <header class="mb-6">
        <p class="text-[13px] tracking-[0.08em] text-brown-soft m-0 mb-[10px]" data-content="rsvp.eyebrow"></p>
        <h1 class="font-serif text-[28px] m-0 mb-[6px]" data-content="rsvp.title"></h1>
        <p class="m-0 text-brown-muted text-[15px]" data-content="rsvp.intro"></p>
      </header>

      <form
        class="flex flex-col gap-[18px]"
        action="https://script.google.com/macros/s/AKfycbxGjtncs1FufA3uFS-jqdViCIpNoVmihqFFPFIbux3_0-xUpgiVq69qV97FbyqoN1x1NA/exec"
        method="POST"
        enctype="application/x-www-form-urlencoded"
        accept-charset="UTF-8"
      >
        <!-- Section 1 : infos contact -->
        <fieldset class="border border-[rgba(230,211,197,0.9)] rounded-[18px] px-4 pt-3 pb-4 bg-[#fffbf7]">
          <legend class="text-[13px] uppercase tracking-[0.16em] text-brown-soft px-1" data-content="rsvp.section.info"></legend>
          <div class="grid gap-[14px] mt-[10px]" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr))">

            <div class="flex flex-col gap-1">
              <label class="text-[13px]" for="names">
                <span data-content="rsvp.label.names"></span><span class="text-[#c45c4a]"> *</span>
              </label>
              <input type="text" id="names" name="names" required
                     class="rounded-xl border border-[rgba(196,167,148,0.6)] px-[10px] py-2 font-sans text-sm bg-[#fffdfb] transition-all duration-[160ms] focus:outline-none focus:border-accent focus:shadow-[0_0_0_1px_rgba(225,166,138,0.6)] focus:bg-white"
                     data-content="rsvp.placeholder.names" placeholder="Ex : Grégoire Louis" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[13px]" for="email">
                <span data-content="rsvp.label.email"></span><span class="text-[#c45c4a]"> *</span>
              </label>
              <input type="email" id="email" name="email" required
                     class="rounded-xl border border-[rgba(196,167,148,0.6)] px-[10px] py-2 font-sans text-sm bg-[#fffdfb] transition-all duration-[160ms] focus:outline-none focus:border-accent focus:shadow-[0_0_0_1px_rgba(225,166,138,0.6)] focus:bg-white"
                     data-content="rsvp.placeholder.email" placeholder="vous@example.com" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[13px]" for="phone" data-content="rsvp.label.phone"></label>
              <input type="tel" id="phone" name="phone"
                     class="rounded-xl border border-[rgba(196,167,148,0.6)] px-[10px] py-2 font-sans text-sm bg-[#fffdfb] transition-all duration-[160ms] focus:outline-none focus:border-accent focus:shadow-[0_0_0_1px_rgba(225,166,138,0.6)] focus:bg-white"
                     data-content="rsvp.placeholder.phone" placeholder="+33 6 12 34 56 78" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[13px]" for="address" data-content="rsvp.label.address"></label>
              <input type="text" id="address" name="address"
                     class="rounded-xl border border-[rgba(196,167,148,0.6)] px-[10px] py-2 font-sans text-sm bg-[#fffdfb] transition-all duration-[160ms] focus:outline-none focus:border-accent focus:shadow-[0_0_0_1px_rgba(225,166,138,0.6)] focus:bg-white"
                     data-content="rsvp.placeholder.address" placeholder="12 rue des Fleurs, 75000 Paris" />
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[13px]" for="guests">
                <span data-content="rsvp.label.guests"></span><span class="text-[#c45c4a]"> *</span>
              </label>
              <input type="number" id="guests" name="guests" min="1" required
                     class="rounded-xl border border-[rgba(196,167,148,0.6)] px-[10px] py-2 font-sans text-sm bg-[#fffdfb] transition-all duration-[160ms] focus:outline-none focus:border-accent focus:shadow-[0_0_0_1px_rgba(225,166,138,0.6)] focus:bg-white" />
            </div>

          </div>
        </fieldset>

        <!-- Section 2 : présence -->
        <fieldset class="border border-[rgba(230,211,197,0.9)] rounded-[18px] px-4 pt-3 pb-4 bg-[#fffbf7]">
          <legend class="text-[13px] uppercase tracking-[0.16em] text-brown-soft px-1" data-content="rsvp.section.presence"></legend>
          <p class="mt-2 mb-0 text-[13px] text-brown-muted" data-content="rsvp.section.presenceHelp"></p>
          <div data-event-rsvp-list class="mt-[10px] flex flex-col gap-2">
            <!-- lignes générées en JS -->
          </div>
        </fieldset>

        <!-- Section 3 : extras -->
        <fieldset class="border border-[rgba(230,211,197,0.9)] rounded-[18px] px-4 pt-3 pb-4 bg-[#fffbf7]">
          <legend class="text-[13px] uppercase tracking-[0.16em] text-brown-soft px-1" data-content="rsvp.section.extra"></legend>
          <div class="grid gap-[14px] mt-[10px]" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr))">

            <div class="flex flex-col gap-1">
              <label class="text-[13px]" for="diet" data-content="rsvp.label.diet"></label>
              <textarea id="diet" name="diet" rows="3"
                        class="rounded-xl border border-[rgba(196,167,148,0.6)] px-[10px] py-2 font-sans text-sm bg-[#fffdfb] resize-y min-h-[80px] transition-all duration-[160ms] focus:outline-none focus:border-accent focus:shadow-[0_0_0_1px_rgba(225,166,138,0.6)] focus:bg-white"
                        data-content="rsvp.placeholder.diet" placeholder="Ex : végétarien, sans gluten…"></textarea>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[13px]" for="message" data-content="rsvp.label.message"></label>
              <textarea id="message" name="message" rows="3"
                        class="rounded-xl border border-[rgba(196,167,148,0.6)] px-[10px] py-2 font-sans text-sm bg-[#fffdfb] resize-y min-h-[80px] transition-all duration-[160ms] focus:outline-none focus:border-accent focus:shadow-[0_0_0_1px_rgba(225,166,138,0.6)] focus:bg-white"
                        data-content="rsvp.placeholder.message" placeholder="On a hâte de vous retrouver !"></textarea>
            </div>

          </div>
        </fieldset>

        <div class="mt-1 flex flex-col gap-[6px] items-start">
          <button type="submit"
                  class="inline-flex items-center justify-center px-[18px] py-[10px] rounded-full bg-[#18100f] text-[#fdf6f1] text-sm font-medium cursor-pointer border-0 shadow-[0_16px_30px_rgba(25,15,12,0.35)] transition-all duration-[160ms] hover:bg-[#241716] hover:-translate-y-px disabled:pointer-events-none"
                  data-content="rsvp.action.submit"></button>
          <p class="m-0 text-[12px] text-brown-soft" data-content="rsvp.action.note"></p>
          <p data-form-status class="m-0 text-[13px] text-[#1b7f5c]" aria-live="polite"></p>
        </div>
      </form>
    </main>

    <footer class="mt-[18px] text-center text-[13px] text-brown-soft">
      <p data-content="footer.rsvp"></p>
    </footer>
  </div>

  <script>
    window.GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWv-f0hAG8tn19SURMEDOcHg3Ht9xJw435XEOgDIt5qT5V-8LpIYlpkv2-7QtG6fW9/exec";
  </script>
  <script src="content.js"></script>
  <script src="navbar.js"></script>
  <script>
    (function () {
      const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbxGjtncs1FufA3uFS-jqdViCIpNoVmihqFFPFIbux3_0-xUpgiVq69qV97FbyqoN1x1NA/exec";
      const SCRIPT_URL  = window.GOOGLE_SCRIPT_URL || DEFAULT_URL;
      // Ces clés doivent rester alignées avec le script Google Sheets.
      const EVENT_FIELD_NAMES = ['verre_accueil', 'ceremonie', 'reception', 'aperetivo'];

      window.contentReady.then(function (data) {
        if (!data) return;
        const { shared, rsvpPage } = data;
        const events = Array.isArray(rsvpPage.events) ? rsvpPage.events : [];

        applyContent({
          text: {
            'rsvp.eyebrow':              rsvpPage.eyebrow,
            'rsvp.title':                rsvpPage.title,
            'rsvp.intro':                rsvpPage.intro,
            'rsvp.section.info':         rsvpPage.sections.info,
            'rsvp.section.presence':     rsvpPage.sections.presence,
            'rsvp.section.presenceHelp': rsvpPage.sections.presenceHelp,
            'rsvp.section.extra':        rsvpPage.sections.extra,
            'rsvp.label.names':          rsvpPage.labels.names,
            'rsvp.label.email':          rsvpPage.labels.email,
            'rsvp.label.phone':          rsvpPage.labels.phone,
            'rsvp.label.address':        rsvpPage.labels.address,
            'rsvp.label.guests':         rsvpPage.labels.guests,
            'rsvp.label.diet':           rsvpPage.labels.diet,
            'rsvp.label.message':        rsvpPage.labels.message,
            'rsvp.action.submit':        rsvpPage.actions.submit,
            'rsvp.action.note':          rsvpPage.actions.note,
            'footer.rsvp':               shared.footer.rsvp,
          },
          attrs: {
            'rsvp.placeholder.names':   { placeholder: rsvpPage.placeholders.names },
            'rsvp.placeholder.email':   { placeholder: rsvpPage.placeholders.email },
            'rsvp.placeholder.phone':   { placeholder: rsvpPage.placeholders.phone },
            'rsvp.placeholder.address': { placeholder: rsvpPage.placeholders.address },
            'rsvp.placeholder.diet':    { placeholder: rsvpPage.placeholders.diet },
            'rsvp.placeholder.message': { placeholder: rsvpPage.placeholders.message },
          },
        });

        // Lignes de présence par événement
        const list = document.querySelector('[data-event-rsvp-list]');
        if (list) {
          list.innerHTML = '';
          events.forEach((ev, i) => {
            const fieldName = EVENT_FIELD_NAMES[i] || `event_${i}`;
            const row = document.createElement('div');
            row.className = 'flex flex-wrap gap-[10px] px-[11px] py-[10px] rounded-[14px] bg-white/90 border border-dashed border-[rgba(206,178,158,0.9)]';

            const label = document.createElement('div');
            label.className = 'min-w-[200px] flex-1';
            label.innerHTML = `<span class="text-sm font-medium">${ev.name || ''}</span><span class="block text-[12px] text-brown-soft">${ev.meta || ''}</span>`;

            const options = document.createElement('div');
            options.className = 'flex flex-wrap gap-x-[14px] gap-y-2 items-center';

            [
              { value: 'oui',       label: rsvpPage.options.present },
              { value: 'non',       label: rsvpPage.options.absent },
              { value: 'incertain', label: rsvpPage.options.unsure },
            ].forEach(({ value, label: optLabel }, oi) => {
              const lEl = document.createElement('label');
              lEl.className = 'text-[13px] inline-flex items-center gap-[5px] cursor-pointer';
              const inp = document.createElement('input');
              inp.type  = 'radio';
              inp.name  = fieldName;
              inp.value = value;
              if (oi === 0) inp.required = true;
              lEl.append(inp, document.createTextNode(optLabel));
              options.appendChild(lEl);
            });

            row.append(label, options);
            list.appendChild(row);
          });
        }

        // Submit
        const form      = document.querySelector('form');
        const statusEl  = document.querySelector('[data-form-status]');
        const submitBtn = form ? form.querySelector('button[type="submit"]') : null;

        const setStatus = (msg, isError = false) => {
          if (!statusEl) return;
          statusEl.textContent = msg || '';
          statusEl.style.color = isError ? '#c45c4a' : '#1b7f5c';
        };

        if (form) {
          form.action       = SCRIPT_URL;
          form.method       = 'POST';
          form.enctype      = 'application/x-www-form-urlencoded';
          form.acceptCharset = 'UTF-8';

          let tsInput = form.querySelector('input[name="timestamp"]');
          if (!tsInput) {
            tsInput = Object.assign(document.createElement('input'), { type: 'hidden', name: 'timestamp' });
            form.appendChild(tsInput);
          }

          const sendWithFallback = async (formData) => {
            const body = new URLSearchParams();
            for (const [k, v] of formData.entries()) body.append(k, v);
            try {
              const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body, mode: 'cors', credentials: 'omit',
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return 'cors';
            } catch (err) {
              console.warn('RSVP: échec CORS, nouvel essai en no-cors', err);
              await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body, mode: 'no-cors',
              });
              return 'opaque';
            }
          };

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            tsInput.value = new Date().toISOString();
            setStatus('Envoi en cours…');
            if (submitBtn) submitBtn.disabled = true;
            try {
              const mode = await sendWithFallback(new FormData(form));
              setStatus(mode === 'cors'
                ? 'Réponse envoyée.'
                : 'Réponse envoyée (confirmation silencieuse). Vérifiez le Google Sheet.');
              form.reset();
            } catch (err) {
              console.error('RSVP submit error', err);
              setStatus("Échec de l'envoi. Vérifiez votre connexion ou réessayez plus tard.", true);
            } finally {
              if (submitBtn) submitBtn.disabled = false;
            }
          });
        }
      });
    })();
  </script>
</body>
</html>
