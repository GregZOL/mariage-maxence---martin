<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Liste de mariage — Mariage Maxence et Martin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link 
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" 
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <div data-site-header data-header-active="list" data-header-solid="true"></div>

    <main class="main-card wedding-list-page">
      <section class="wedding-list-section wedding-list-section--foundation" data-content="list.foundation.sectionLabel" aria-label="">
        <div class="wedding-list-media wedding-list-media--logo">
          <a
            class="wedding-list-image-link"
            href="https://www.helloasso.com/associations/fondation-pour-l-enfance/formulaires/8"
            target="_blank"
            rel="noreferrer noopener"
          >
            <span class="wedding-list-logo-wrap">
              <img src="assets/LOGO_Goeland_26_avril_2022.png" data-content="list.foundation.logoAlt" alt="" />
            </span>
          </a>
        </div>
        <div class="venue-block wedding-list-block">
          <p class="wedding-list-text" data-content="list.foundation.text"></p>
        </div>
      </section>

      <section class="wedding-list-section wedding-list-section--couple" data-content="list.couple.sectionLabel" aria-label="">
        <div class="wedding-list-media">
          <a
            class="wedding-list-image-link"
            href="https://www.millemercismariage.com/maxencemartin-0108/liste.html"
            target="_blank"
            rel="noreferrer noopener"
          >
            <span class="wedding-list-image-wrap">
              <!-- <img src="assets/photo-maries.jpeg" data-content="list.couple.imageAlt" alt="" />  -->
              <img class="image4" src="assets/bandana.png" data-content="list.couple.imageAlt" alt="" />
              <img class="image4" src="assets/blur.png" data-content="list.couple.imageAlt" alt="" />
              <img class="image4" src="assets/spacegirl.png" data-content="list.couple.imageAlt" alt="" />
              <img class="image4" src="assets/spaceguy.png" data-content="list.couple.imageAlt" alt="" />
              
            </span>
          </a>
        </div>
        <div class="venue-block wedding-list-block">
          <p class="wedding-list-text" data-content="list.couple.text"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p data-content="footer.list"></p>
    </footer>
  </div>

  <script src="content.js"></script>
  <script>
    (function () {
      const { shared, listPage } = window.siteContent;

      applyContent({
        text: {
          "brand.mark": shared.brandMark,
          "brand.names": shared.brandNames,
          "brand.sub": shared.brandSub,
          "nav.program": shared.nav.program,
          "nav.venue": shared.nav.venue,
          "nav.list": shared.nav.list,
          "nav.dresscode": shared.nav.dresscode,
          "nav.rsvp": shared.nav.rsvp,
          "list.foundation.text": listPage.foundation.text,
          "list.couple.text": listPage.couple.text,
          "footer.list": shared.footer.list,
        },
        attrs: {
          "list.foundation.sectionLabel": { "aria-label": listPage.foundation.sectionLabel },
          "list.foundation.logoAlt": { alt: listPage.foundation.logoAlt },
          "list.couple.sectionLabel": { "aria-label": listPage.couple.sectionLabel },
          "list.couple.imageAlt": { alt: listPage.couple.imageAlt },
        },
      });
    })();
  </script>
</body>
</html>
